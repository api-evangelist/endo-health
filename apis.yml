aid: endo-health
name: Endo Health
description: >-
  Endo Health is building Glow, an AI-native clinic for women's weight loss.
  Describing itself as "the emotional layer of healthcare" and aiming to "make
  health addictive," the company treats the drivers behind symptoms rather than
  the symptoms alone, delivering conversational, connection-first care through a
  mobile health app. Its stated mission is to advance human lifespan by one year.
  Endo Health is backed by General Catalyst and a16z Speedrun, with teams in San
  Francisco and Seoul. This is a consumer digital-health product; no public API,
  developer portal, or documentation surface has been published at this time.
